name: Scheduled Minecraft Data Bulk Generate

on:
  schedule:
    # Runs daily at 02:00 and 14:00 UTC (twice daily)
    - cron: '0 2,14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bulk-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git user for actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then python -m pip install --upgrade pip && pip install -r requirements.txt; else echo "No requirements.txt found, skipping pip install"; fi

      - name: Setup Java (required by data generator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Compute manifest hash for cache key
        id: manifest
        run: |
          set -e
          TMP_MANIFEST=$(mktemp)
          trap 'rm -f "$TMP_MANIFEST"' EXIT
          python3 manifest.py > "$TMP_MANIFEST"
          VERSIONS_LINE=$(grep '^versions=' "$TMP_MANIFEST" | cut -d= -f2 || true)
          echo "versions=$VERSIONS_LINE" >> $GITHUB_OUTPUT
          HASH=$(printf "%s" "$VERSIONS_LINE" | sha1sum | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Restore server JARs cache
        uses: actions/cache@v4
        with:
          path: .mc_cache
          key: mc-jars-${{ steps.manifest.outputs.hash }}
          restore-keys: |
            mc-jars-

      - name: Prepare cache directory and symlink to /tmp/datagenerator
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.mc_cache"
          rm -rf /tmp/datagenerator || true
          ln -s "$GITHUB_WORKSPACE/.mc_cache" /tmp/datagenerator

      - name: Run bulk_generate.sh
        run: |
          bash ./bulk_generate.sh

